[package]
name = "pixelmapper-net"
description = "Art-Net 4 / RDM host tooling for the Pixelmapper node and LED tubes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pmnet"
path = "src/bin/pmnet.rs"

[dependencies]
clap.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"
libc = "0.2"
rand = "0.9"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }
