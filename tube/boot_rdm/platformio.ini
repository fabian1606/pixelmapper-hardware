; tube_boot_rdm - RDM (ANSI E1.20) bootloader for the ATmega8 in the XBAR500
; LED tube: firmware updates through any RDM controller / Art-Net node.
; plain avr-libc. Lives in the 2 KB boot section at 0x1800 (= NRWW section,
; hfuse BOOTSZ=00 + BOOTRST = 0x88, see ../firmware/README.md "Update über RDM").
; Shares config.h / boot_shared.h / rdm_boot.h with the app (../firmware/include).
;
; Build only - flashing is a manual one-time ISP step (merged with the app via
; flash_rdm.py --hex-out, see README). There is deliberately no upload target.

[platformio]
default_envs = boot

[env:boot]
platform = atmelavr
board = ATmega8
board_build.f_cpu = 16000000UL
; whole boot section; pio's size check counts from .text start = 0x1800
board_upload.maximum_size = 2048
build_flags =
    -DBOOT_LAYOUT_2K
    -Os
    -Wall
    -Wextra
    -std=gnu11
    -I../firmware/include
    -ffunction-sections
    -fdata-sections
    -fno-inline-small-functions
    -nostartfiles
    -Wl,--section-start=.text=0x1800
    -Wl,--gc-sections
    ; stack below the RAM magic (BOOT_STACK_TOP in boot_shared.h = RAMEND - 2)
    -Wl,--defsym=__stack=0x45D
; single file, LTO buys nothing and would hide boot_main from the asm jump
build_unflags = -flto
extra_scripts = extra_script.py
