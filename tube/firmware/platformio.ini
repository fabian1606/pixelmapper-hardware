; tube_fw - DMX512/RDM firmware for the ATmega8 inside the XBAR500 LED tube
; plain avr-libc (no Arduino framework)

[platformio]
default_envs = isp

[env]
platform = atmelavr
board = ATmega8
; resolved: CQ16000 crystal, 16 MHz
board_build.f_cpu = 16000000UL
; application must stay below 0x1800 - 16 = 6128 B: the 2 KB bootloader
; (../boot_rdm, BOOTSZ = 1024 words @ 0x1800) follows, and the last 16
; bytes of the app space (0x17F0) hold the trailer: metadata (section
; .trailer) + length + CRC16 (boot_shared.h). extra_script.py places the
; metadata and writes .pio/build/<env>/tube_fw-<version>.hex = app + complete
; trailer (the image for flash_rdm.py / Pixelmapper).
; Legacy 1 KB layout (old tube_boot, only in the ledTubeXBAR500 archive): env:isp_1k.
board_upload.maximum_size = 6128
extra_scripts = extra_script.py
build_flags =
    -DBOOT_LAYOUT_2K
    -Wall
    -Wextra
    -std=gnu11
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -mcall-prologues
    ; stack starts below the bootloader magic in the last 2 bytes of SRAM
    ; (BOOT_STACK_TOP in boot_shared.h = RAMEND - 2)
    -Wl,--defsym=__stack=0x45D

; ---------------------------------------------------------------------------
; Flash via ArduinoISP sketch on an Arduino Uno.
;   pio run -e isp -t upload
; "-e" = chip erase. The first flash MUST erase: the original chip is locked
; (lock 0xE8). NOTE: chip erase also clears the EEPROM (EESAVE not set) ->
; the device ID has to be written afterwards (see README).
; Once a bootloader is installed this target would erase it (and flashes no
; CRC trailer) -> use the merged hex (flash_rdm.py --hex-out) or flash_rdm.py.
; ---------------------------------------------------------------------------
[env:isp]
upload_protocol = stk500v1
upload_port = /dev/cu.usbmodem101
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
    -e

; ---------------------------------------------------------------------------
; Legacy layout for tubes that still run the old 1 KB tube_boot (0x1C00,
; hfuse 0x8A, flash_dmx.py). Same code, only the size limit differs:
;   pio run -e isp_1k     -> .pio/build/isp_1k/firmware.hex for flash_dmx.py
; ---------------------------------------------------------------------------
[env:isp_1k]
extends = env:isp
board_upload.maximum_size = 7164
build_unflags = -DBOOT_LAYOUT_2K

; ---------------------------------------------------------------------------
; Bench self-test: endless LED pattern instead of DMX (see main.c).
;   pio run -e selftest -t upload
; ---------------------------------------------------------------------------
[env:selftest]
extends = env:isp
build_flags =
    ${env.build_flags}
    -DSELFTEST_LOOP

; ---------------------------------------------------------------------------
; Fuses - NOT written automatically. Values currently read from the tube:
;   lfuse = 0x2F   (ext. crystal CKSEL=1111, SUT=10, BOD on @4.0 V)
;   hfuse = 0x8F   (WDTON programmed, SPIEN on, CKOPT on, EESAVE off,
;                   BOOTSZ=11, BOOTRST off)
;   lock  = 0xE8   (read/write protected - removed by chip erase)
; With the RDM bootloader (../boot_rdm, README "Update über RDM") - by hand only:
;   hfuse 0x88  = BOOTRST on + BOOTSZ=00 (2 KB boot section @ 0x1800)
;   hfuse 0x80  = same + EESAVE (EEPROM survives chip erase)
; Legacy 1 KB tube_boot: hfuse 0x8A (BOOTSZ=01, 0x1C00) / 0x82 with EESAVE.
;   never touch lfuse / SPIEN / RSTDISBL / CKSEL.
; board_fuses.lfuse = 0x2F
; board_fuses.hfuse = 0x8F
; ---------------------------------------------------------------------------
